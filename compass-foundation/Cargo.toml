[workspace]
members = ["crates/compass-core", "crates/compass-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
